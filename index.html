<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Game subtitles</title>
<style>html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}.wrap{width:100%;padding:8vw;box-sizing:border-box;text-align:center}.history{opacity:.45;font-size:clamp(1rem,3.5vw,1.6rem);line-height:1.4}.active{font-size:clamp(1.6rem,5vw,2.8rem);line-height:1.3;min-height:1.3em;unicode-bidi:plaintext}.dot{position:fixed;right:12px;top:12px;width:8px;height:8px;border-radius:50%;background:#777}.dot.on{background:#35d07f}.wake{position:fixed;bottom:18px;right:18px;display:none;background:#222;color:#fff;border:1px solid #555;border-radius:8px;padding:10px}.wake.show{display:block}#nosleep{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}</style></head>
<body><video id="nosleep" muted playsinline loop></video><span class="dot" id="dot"></span><main class="wrap"><div class="history" id="history"></div><div class="active" id="active" dir="auto"></div></main><button class="wake show" id="wake">Tap to keep screen awake</button>
<script>
const active=document.querySelector('#active'),historyEl=document.querySelector('#history'),dot=document.querySelector('#dot'),wake=document.querySelector('#wake'),video=document.querySelector('#nosleep');let ws,wakeLock,history=[];
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function bidi(s){return esc(s).replace(/([A-Za-z][A-Za-z0-9'’._-]*(?:\s+[A-Za-z][A-Za-z0-9'’._-]*)*)/g,'<bdi dir="ltr">$1</bdi>')}function render(){historyEl.innerHTML=history.slice(-3).map(x=>`<div dir="auto">${bidi(x)}</div>`).join('')}
function connect(){ws=new WebSocket(`ws://${location.host}/ws`);ws.onopen=()=>dot.classList.add('on');ws.onclose=()=>{dot.classList.remove('on');setTimeout(connect,1000)};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='subtitle'){active.innerHTML=bidi(m.hebrew);history.push(m.hebrew);render()}}}connect();
async function keepAwake(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}try{if(!HTMLCanvasElement.prototype.captureStream)return;const c=document.createElement('canvas');c.width=c.height=2;c.getContext('2d').fillRect(0,0,2,2);video.srcObject=c.captureStream(1);await video.play()}catch(e){}}wake.onclick=async()=>{await keepAwake();wake.classList.remove('show')};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});
</script></body></html>
