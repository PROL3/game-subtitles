<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game subtitles</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}#noSleepVideo{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}.wrap{width:100%;padding:8vw;box-sizing:border-box;text-align:center;unicode-bidi:plaintext}.history{opacity:.45;font-size:clamp(1rem,3.5vw,1.6rem);line-height:1.45;margin-bottom:1.4rem}.history div{margin:.2rem 0}.active{font-size:clamp(1.6rem,5vw,2.8rem);line-height:1.25;min-height:1.25em;unicode-bidi:plaintext}.dot{position:fixed;right:12px;top:12px;width:8px;height:8px;border-radius:50%;background:#777}.dot.on{background:#35d07f}.controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);opacity:0;transition:opacity .25s}.controls.show{opacity:.75}.controls button{background:#222;color:#fff;border:1px solid #555;border-radius:8px;padding:8px 14px;font-size:1rem;margin:3px}.wake{position:fixed;bottom:18px;right:18px;display:none;background:#222;color:#fff;border:1px solid #555;border-radius:8px;padding:9px 12px;font-size:.85rem}.wake.show{display:block}
</style></head>
<body><video id="noSleepVideo" muted playsinline loop aria-hidden="true"></video><div class="dot" id="dot"></div><main class="wrap"><section class="history" id="history"></section><div class="active" id="active" dir="auto" aria-live="polite"></div></main><div class="controls" id="controls"><button id="minus">−</button><button id="plus">+</button></div><button class="wake" id="wake">Tap to keep screen awake</button>
<script>
const active=document.querySelector('#active'),historyEl=document.querySelector('#history'),dot=document.querySelector('#dot'),controls=document.querySelector('#controls');let ws,hideTimer,scale=1;
function bidi(s){
  const safe=esc(s);
  // Keep Latin names/brands/game terms in an isolated left-to-right run.
  return safe.replace(/([A-Za-z][A-Za-z0-9'’._-]*(?:\s+[A-Za-z][A-Za-z0-9'’._-]*)*)/g,'<bdi dir="ltr">$1</bdi>');
}
function usableTranslation(s){return (s.match(/[\u0590-\u05FF]/g)||[]).length>=2}
function renderHistory(xs=[]){historyEl.innerHTML=xs.slice(-3,-0||undefined).map(x=>`<div dir="auto" style="unicode-bidi:plaintext;direction:auto">${bidi(x)}</div>`).join('')}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function connect(){ws=new WebSocket(`ws://${location.host}/ws`);ws.onopen=()=>dot.classList.add('on');ws.onclose=()=>{dot.classList.remove('on');setTimeout(connect,1000)};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='state'||m.type==='start')renderHistory(m.history);if(m.type==='start')active.innerHTML='';if(m.type==='token'||m.type==='done'){const value=m.active||m.text||'';active.innerHTML=usableTranslation(value)?bidi(value):''}if(m.type==='done')renderHistory(m.history)}}connect();
let wakeLock=null,noSleepStarted=false;const wakeButton=document.querySelector('#wake'),noSleepVideo=document.querySelector('#noSleepVideo');
function startNoSleep(){
  if(noSleepStarted||!HTMLCanvasElement.prototype.captureStream)return;
  const canvas=document.createElement('canvas');canvas.width=2;canvas.height=2;
  const ctx=canvas.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,2,2);
  noSleepVideo.srcObject=canvas.captureStream(1);noSleepVideo.muted=true;noSleepVideo.playsInline=true;
  noSleepVideo.play().then(()=>{noSleepStarted=true;wakeButton.classList.remove('show')}).catch(()=>wakeButton.classList.add('show'));
}
async function requestWake(){
  startNoSleep();
  if(!('wakeLock' in navigator)){wakeButton.textContent='Screen wake unavailable';wakeButton.classList.add('show');return}
  try{wakeLock=await navigator.wakeLock.request('screen');wakeButton.classList.remove('show');wakeLock.addEventListener('release',()=>wakeButton.classList.add('show'))}catch(e){if(!noSleepStarted)wakeButton.classList.add('show')}
}
wakeButton.onclick=requestWake;if(window.isSecureContext)requestWake();else wakeButton.classList.add('show');document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')requestWake()});
function show(){controls.classList.add('show');clearTimeout(hideTimer);hideTimer=setTimeout(()=>controls.classList.remove('show'),3000)}document.body.addEventListener('click',show);document.querySelector('#plus').onclick=()=>{scale=Math.min(1.4,scale+.1);document.querySelector('.wrap').style.transform=`scale(${scale})`};document.querySelector('#minus').onclick=()=>{scale=Math.max(.7,scale-.1);document.querySelector('.wrap').style.transform=`scale(${scale})`};
</script></body></html>
